<header class="bg-primary-600 fixed top-0 w-full z-50">
    <nav class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <a href="{{ .Site.BaseURL }}" class="text-xl font-bold text-white">BTN Advisory</a>

            <!-- Mobile Menu Button -->
            <button type="button" onclick="toggleMenu()" class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-white hover:text-primary-100 hover:bg-primary-700">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center space-x-6">
                <a href="/#about" class="nav-link">About</a>
                <a href="/#advisory" class="nav-link">Advisory</a>
                <a href="/enlighten-session/" class="nav-link">Enlighten Session</a>
                <a href="/contact/" class="btn-contact">Contact</a>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden">
            <div class="px-2 pt-2 pb-3 space-y-1 bg-primary-700">
                <a href="/#about" class="block px-3 py-2 text-base font-medium text-white hover:text-primary-100">About</a>
                <a href="/#advisory" class="block px-3 py-2 text-base font-medium text-white hover:text-primary-100">Advisory</a>
                <a href="/enlighten-session/" class="block px-3 py-2 text-base font-medium text-white hover:text-primary-100">Enlighten Session</a>
                <a href="/contact/" class="block px-3 py-2 text-base font-medium bg-white text-primary-600 rounded-md">Contact</a>
            </div>
        </div>
    </nav>
</header>

<script>
    function toggleMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }
</script>
