#baseURL = 'https://btorb.github.io/btn-advisory.ch'  # no trailing slash, local: '/'
baseURL = 'https://btn-advisory.ch/'

languageCode = 'en-us'
title = 'BTN Advisory'

[build]
  writeStats = true

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [module.hugoVersion]
    extended = true

[css]
  [css.postcss]
    path = "main.css"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"

[menu]
  [[menu.main]]
    name = "About"
    url = "/#about"
    weight = 1
  [[menu.main]]
    name = "Advisory"
    url = "/#advisory"
    weight = 2
  [[menu.main]]
    name = "Enlighten Session"
    url = "/enlighten-session/"
    weight = 3
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 4

verbose = true
verboseLog = true